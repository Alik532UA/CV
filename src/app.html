<!doctype html>
<!--
	lang підставляє src/hooks.server.ts під час prerender — по одному значенню
	на сторінку. Тут стояло `lang="en"`, і всі 42 мовні версії їхали англійськими
	для кравлера й читалки екрана: справжню мову виставляв лише клієнтський код
	після гідрації.
-->
<html lang="%lang%">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<meta name="theme-color" content="#050505" />
	<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />

	<!--
		Шрифт підключений тут, а не через `@import` в app.css, і це не стиль, а
		швидкість. `@import` усередині CSS змушує браузер спершу завантажити й
		розпарсити app.css, ЛИШЕ ПОТІМ побачити адресу шрифтового CSS,
		завантажити його і лише тоді — самі файли шрифту. Три послідовні кроки,
		кожен — окремий round-trip.

		`<link>` у розмітці бачить preload-сканер одразу, ще до парсингу CSS, і
		тягне шрифтовий CSS паралельно з app.css. `preconnect` заздалегідь
		відкриває з'єднання з обома хостами Google Fonts (CSS лежить на
		googleapis.com, самі файли — на gstatic.com), щоб на момент запиту не
		платити за DNS і TLS.

		`display=swap` лишається в адресі: без нього текст невидимий, поки
		шрифт вантажиться (PERFORMANCE-v8 § 2).
	-->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap"
	/>
	<!--
		These two rules hide the page's native scrollbar, and they live here rather
		than in app.css on purpose.

		The class below is added before anything paints, but a class on its own does
		nothing — the rule acting on it has to be in effect by the same moment. In a
		production build app.css is a render-blocking <link> and it is; the dev server
		injects bundled CSS through JavaScript instead, so at first paint the class was
		set with no rule behind it, and the native bar appeared and then vanished.
		Static markup in the head cannot arrive late in either environment.

		Everything else about scroll bars — the variables, the inner bars — stays in
		app.css. Only the first-frame guarantee is here.
	-->
	<style>
		html.has-custom-scrollbar {
			scrollbar-width: none;
		}

		html.has-custom-scrollbar::-webkit-scrollbar {
			display: none;
		}
	</style>
	<script>
		(function () {
			try {
				var PREFIX = 'cv-svelte_';
				var saved = localStorage.getItem(PREFIX + 'theme') || localStorage.getItem('theme');
				var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				var theme = saved || (prefersDark ? 'dark' : 'light');
				document.documentElement.setAttribute('data-theme', theme);
				document.documentElement.style.colorScheme = theme;

				// Hide the native bar before the first frame, or it shows and then
				// vanishes once the components mount — the same flicker the theme
				// lines above exist to prevent.
				//
				// DUPLICATED CONDITIONS: this must agree with
				// src/lib/controllers/ScrollbarState.svelte.ts, which a script in the
				// document head cannot import. src/scrollbar-canon.test.ts fails if
				// the two drift apart.
				var sb = localStorage.getItem(PREFIX + 'scrollbarMode') || 'custom';
				var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
				var wide = window.matchMedia('(min-width: 1100px)').matches;
				if (fine && (sb === 'custom' || ((sb === 'minimap' || sb === 'minimap-full') && wide))) {
					document.documentElement.classList.add('has-custom-scrollbar');
				}
			} catch (e) { }
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
