# Cloudflare Worker: AI-проксі для CV. Ключі провайдерів — секрети (wrangler
# secret put), у цьому файлі їх немає і бути не може: він у git.
name = "cv-ai-proxy"
main = "index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
# Кома-розділений список публічних origin'ів, у нижньому регістрі — саме так їх
# надсилає браузер. localhost сюди писати не треба: будь-який його порт дозволений
# у коді (порт dev-сервера змінюється, див. isAllowedOrigin).
ALLOWED_ORIGINS = "https://alik532ua.github.io"

# Ліміти проти вичерпання квоти через відкритий проксі.
RATE_PER_MINUTE = "6"
RATE_PER_DAY = "40"
DAILY_TOTAL = "300"
