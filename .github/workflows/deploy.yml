name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static Analysis
        run: |
          npm run check
          npm run check:worker

      - name: Linting
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit

      # Ключів AI тут немає свідомо: усе, що потрапляє в збірку статичного сайту,
      # видно у DevTools. Ключі живуть секретами Cloudflare Worker, а сайт знає
      # лише його URL.
      - name: Build
        env:
          PUBLIC_AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Окрема job, а не крок у попередній: деплой сайту не має падати через
  # Cloudflare, і навпаки. wrangler deploy ідемпотентний, тож ганяємо на кожен
  # push — це дешевше й надійніше за фільтр змінених файлів.
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy AI proxy (Cloudflare Worker)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler deploy --config worker/wrangler.toml

      - name: Skip AI proxy deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN не заданий — AI-проксі не задеплоєно."
          echo "Токен: Cloudflare Dashboard → My Profile → API Tokens → Edit Cloudflare Workers."
