name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static Analysis
        run: |
          npm run check
          npm run check:worker

      - name: Linting
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit

      # Поріг high, а не moderate: після оновлення лишилися лише 4 low, але
      # moderate-поріг довелося б вимкнути на першому ж транзитивному
      # попередженні, а вимкнений гейт гірший за відсутній.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Кеш браузерів між прогонами: `npm ci` їх не приносить, а
      # `playwright install` без кешу качає ~130 МБ щоразу.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # ВЕСЬ chromium-набір, а не два вибрані файли.
      #
      # Доти тут виконувався лише `tests/invariants.spec.ts` з поміткою, що
      # решта — «окрема історія з іншим часом і іншою стабільністю». Історія
      # з'ясувалася: набір падав не від нестабільності, а від сліпих кліків до
      # гідрації і від dev-сервера, який захлинався під паралельним
      # навантаженням. Обидві причини усунені, `webServer` тепер піднімає
      # ПРЕВ'Ю ЗІБРАНОГО САЙТУ (CODE-QUALITY-v8 § 5.7), і повний прогін іде
      # 49 с проти 1,1 хв на dev.
      #
      # Що саме тут перевіряється, крім користувацьких сценаріїв:
      #   - унікальність data-testid у РАНТАЙМІ, зокрема при відкритих модалці
      #     PDF і мовному меню (TESTID-AND-NAMING-v8 § 1.9.2): статична
      #     перевірка бачить усі testid, але не бачить, що один компонент
      #     відрендерився двічі;
      #   - машинно-виявні порушення WCAG (ACCESSIBILITY-v8 § 10). Поріг —
      #     базове число з tests/a11y-baseline.ts плюс перелік відомих id, а не
      #     літеральний нуль: нуль червонів би від оновлення axe-core без
      #     жодної зміни коду, і такий гейт вимикають (§ 10.1.1). axe бачить
      #     близько третини проблем і лише стан одразу після goto(), тому в
      #     наборі є окремий сценарій із ВІДКРИТОЮ модалкою, а ручний прохід
      #     лишається обов'язковим.
      #
      # Крок збирає сайт сам (це частина команди `webServer`) і тому не
      # залежить від кроку Build нижче. Так навмисно: прев'ю над ЧУЖОЮ, старою
      # збіркою дає падіння, які виглядають як регресії у свіжому коді
      # (CODE-QUALITY-v8 § 5.7).
      - name: E2E (chromium) — сценарії, testid-інваріант, axe
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Ключів AI тут немає свідомо: усе, що потрапляє в збірку статичного сайту,
      # видно у DevTools. Ключі живуть секретами Cloudflare Worker, а сайт знає
      # лише його URL.
      - name: Build
        env:
          PUBLIC_AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
        run: npm run build

      # Збірка не має чіпати відстежувані файли, і це ЄДИНА машинна перевірка
      # правила «артефакт збірки не комітиться» (VERSIONING-v8 § 1.4,
      # CI-CD-AND-TOOLS-v8 § 1.5). Типовий порушник — `static/app-version.json`:
      # варто дописати туди момент збірки, і робоче дерево стає брудним після
      # кожного локального прогону, а `git status` перестає щось означати.
      - name: Збірка не змінює відстежувані файли
        run: git diff --exit-code

      # Клас дефектів, якого не видно в коді: зсув мов від модульного
      # синглтона під час prerender, `sveltekit-prerender` в адресах, порожнє
      # тіло сторінки, зламані абсолютні URL від відносного base. Усе це
      # читається з build/, тому крок стоїть саме тут — між збіркою і
      # викладанням (SEO-v8 § 6.1).
      - name: Verify build output
        run: npm run check:build

      # Бюджет початкового JS (PERFORMANCE-v8 § 1). Міряє те, що браузер тягне
      # на першу сторінку, а не теку `entry/` з шаблону канону — там лежать два
      # завантажувачі на 2 КБ, і гейт над ними не впав би ніколи.
      - name: Check JS budget
        run: npm run check:bundle

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Окрема job, а не крок у попередній: деплой сайту не має падати через
  # Cloudflare, і навпаки. wrangler deploy ідемпотентний, тож ганяємо на кожен
  # push — це дешевше й надійніше за фільтр змінених файлів.
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy AI proxy (Cloudflare Worker)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler deploy --config worker/wrangler.toml

      - name: Skip AI proxy deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN не заданий — AI-проксі не задеплоєно."
          echo "Токен: Cloudflare Dashboard → My Profile → API Tokens → Edit Cloudflare Workers."
