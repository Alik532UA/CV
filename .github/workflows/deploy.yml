name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static Analysis
        run: |
          npm run check
          npm run check:worker

      - name: Linting
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit

      # Поріг high, а не moderate: після оновлення лишилися лише 4 low, але
      # moderate-поріг довелося б вимкнути на першому ж транзитивному
      # попередженні, а вимкнений гейт гірший за відсутній.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Рантайм-інваріант унікальності data-testid (TESTID-AND-NAMING-v8 § 1.9.2).
      # Статична перевірка в юніт-тестах бачить усі testid, але не бачить, що
      # один компонент відрендерився двічі — тоді два різні елементи
      # відповідають одному селектору, і тест бере перший-ліпший.
      #
      # Лише chromium і лише цей файл: решта e2e-набору (54 тести в трьох
      # браузерах) — окрема історія з іншим часом і іншою стабільністю, а
      # § 1.9.3 вимагає в CI саме інваріант. Playwright сам піднімає dev-сервер
      # (`webServer` у конфізі), тому крок не залежить від збірки.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Unique data-testid invariant
        run: npx playwright test tests/invariants.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Ключів AI тут немає свідомо: усе, що потрапляє в збірку статичного сайту,
      # видно у DevTools. Ключі живуть секретами Cloudflare Worker, а сайт знає
      # лише його URL.
      - name: Build
        env:
          PUBLIC_AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
        run: npm run build

      # Клас дефектів, якого не видно в коді: зсув мов від модульного
      # синглтона під час prerender, `sveltekit-prerender` в адресах, порожнє
      # тіло сторінки, зламані абсолютні URL від відносного base. Усе це
      # читається з build/, тому крок стоїть саме тут — між збіркою і
      # викладанням (SEO-v8 § 6.1).
      - name: Verify build output
        run: npm run check:build

      # Бюджет початкового JS (PERFORMANCE-v8 § 1). Міряє те, що браузер тягне
      # на першу сторінку, а не теку `entry/` з шаблону канону — там лежать два
      # завантажувачі на 2 КБ, і гейт над ними не впав би ніколи.
      - name: Check JS budget
        run: npm run check:bundle

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Окрема job, а не крок у попередній: деплой сайту не має падати через
  # Cloudflare, і навпаки. wrangler deploy ідемпотентний, тож ганяємо на кожен
  # push — це дешевше й надійніше за фільтр змінених файлів.
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy AI proxy (Cloudflare Worker)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler deploy --config worker/wrangler.toml

      - name: Skip AI proxy deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN не заданий — AI-проксі не задеплоєно."
          echo "Токен: Cloudflare Dashboard → My Profile → API Tokens → Edit Cloudflare Workers."
